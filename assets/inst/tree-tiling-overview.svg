<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ea"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; }
      .subtitle { font: 500 20px "PingFang SC", "Noto Sans SC", sans-serif; fill: #4a6278; }
      .panel-title { font: 700 26px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; }
      .panel-text { font: 500 18px "PingFang SC", "Noto Sans SC", sans-serif; fill: #375068; }
      .node { fill: #ffffff; stroke: #294963; stroke-width: 3; }
      .node-text { font: 700 20px "SFMono-Regular", Consolas, monospace; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
      .asm { font: 700 20px "SFMono-Regular", Consolas, monospace; fill: #12314a; }
      .note { font: 600 17px "PingFang SC", "Noto Sans SC", sans-serif; fill: #34506a; }
      .badge-text { font: 700 18px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="90" r="150" fill="#d7ead7" opacity="0.4"/>
  <circle cx="90" cy="790" r="180" fill="#d7e8fa" opacity="0.45"/>

  <text x="90" y="86" class="title">Instruction Selection as Tree Tiling</text>
  <text x="90" y="124" class="subtitle">把 IR 树切成一组可执行的 machine-instruction tiles</text>

  <rect x="70" y="160" width="760" height="660" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="870" y="160" width="460" height="660" rx="28" fill="url(#panel)" filter="url(#shadow)"/>

  <text x="110" y="215" class="panel-title">IR tree</text>
  <text x="910" y="215" class="panel-title">Selected instructions</text>

  <rect x="285" y="245" width="150" height="56" rx="18" fill="#ffe08a" opacity="0.85"/>
  <text x="360" y="280" class="badge-text">Tile 1</text>
  <rect x="480" y="395" width="160" height="56" rx="18" fill="#9fd4ff" opacity="0.9"/>
  <text x="560" y="430" class="badge-text">Tile 2</text>
  <rect x="178" y="555" width="180" height="56" rx="18" fill="#9fe2c0" opacity="0.9"/>
  <text x="268" y="590" class="badge-text">Tile 3</text>
  <rect x="505" y="555" width="180" height="56" rx="18" fill="#f9b7cb" opacity="0.9"/>
  <text x="595" y="590" class="badge-text">Tile 4</text>

  <line x1="360" y1="301" x2="360" y2="348" stroke="#294963" stroke-width="4"/>
  <line x1="360" y1="348" x2="240" y2="410" stroke="#294963" stroke-width="4"/>
  <line x1="360" y1="348" x2="560" y2="410" stroke="#294963" stroke-width="4"/>
  <line x1="240" y1="440" x2="180" y2="515" stroke="#294963" stroke-width="4"/>
  <line x1="240" y1="440" x2="300" y2="515" stroke="#294963" stroke-width="4"/>
  <line x1="560" y1="440" x2="500" y2="515" stroke="#294963" stroke-width="4"/>
  <line x1="560" y1="440" x2="620" y2="515" stroke="#294963" stroke-width="4"/>
  <line x1="620" y1="545" x2="620" y2="635" stroke="#294963" stroke-width="4"/>

  <rect x="300" y="310" width="120" height="52" rx="16" class="node"/>
  <text x="360" y="336" class="node-text">MOVE</text>

  <rect x="180" y="388" width="120" height="52" rx="16" class="node"/>
  <text x="240" y="414" class="node-text">MEM</text>

  <rect x="500" y="388" width="120" height="52" rx="16" class="node"/>
  <text x="560" y="414" class="node-text">LOAD</text>

  <rect x="120" y="515" width="120" height="52" rx="16" class="node"/>
  <text x="180" y="541" class="node-text">ADD</text>

  <rect x="240" y="515" width="120" height="52" rx="16" class="node"/>
  <text x="300" y="541" class="node-text">TEMP a</text>

  <rect x="440" y="515" width="120" height="52" rx="16" class="node"/>
  <text x="500" y="541" class="node-text">MEM</text>

  <rect x="560" y="515" width="120" height="52" rx="16" class="node"/>
  <text x="620" y="541" class="node-text">TEMP x</text>

  <rect x="560" y="635" width="120" height="52" rx="16" class="node"/>
  <text x="620" y="661" class="node-text">TEMP p</text>

  <rect x="120" y="635" width="120" height="52" rx="16" class="node"/>
  <text x="180" y="661" class="node-text">TEMP i</text>

  <rect x="240" y="635" width="120" height="52" rx="16" class="node"/>
  <text x="300" y="661" class="node-text">CONST 4</text>

  <path d="M945 295 L1005 295 L1005 520 L1090 520" fill="none" stroke="#d99a00" stroke-width="6" stroke-linecap="round"/>
  <path d="M945 365 L1025 365 L1025 590 L1090 590" fill="none" stroke="#3f8fd9" stroke-width="6" stroke-linecap="round"/>
  <path d="M945 435 L1045 435 L1045 660 L1090 660" fill="none" stroke="#33a06f" stroke-width="6" stroke-linecap="round"/>
  <path d="M945 505 L1065 505 L1065 730 L1090 730" fill="none" stroke="#d36a95" stroke-width="6" stroke-linecap="round"/>

  <rect x="1090" y="260" width="200" height="70" rx="18" fill="#fff8dc" stroke="#d99a00" stroke-width="3"/>
  <text x="1120" y="304" class="asm">STORE [r1], r2</text>

  <rect x="1090" y="330" width="200" height="70" rx="18" fill="#eef7ff" stroke="#3f8fd9" stroke-width="3"/>
  <text x="1120" y="374" class="asm">LOAD r2, [p]</text>

  <rect x="1090" y="400" width="200" height="70" rx="18" fill="#edf9f1" stroke="#33a06f" stroke-width="3"/>
  <text x="1120" y="444" class="asm">MUL r1, i, 4</text>

  <rect x="1090" y="470" width="200" height="70" rx="18" fill="#fff0f5" stroke="#d36a95" stroke-width="3"/>
  <text x="1120" y="514" class="asm">ADD r1, a, r1</text>

  <text x="915" y="592" class="note">每个 tile 对应一条或一类指令模式</text>
  <text x="915" y="625" class="note">覆盖整棵树以后，就得到完整指令序列</text>
  <text x="915" y="688" class="note">目标:</text>
  <text x="980" y="688" class="note">少的 tile / 低的总代价 / 可执行顺序</text>
  <text x="915" y="748" class="note">课堂提示: 可以先指出“IR 每个节点只做一件事”</text>
  <text x="915" y="781" class="note">再解释“真实机器指令往往一次覆盖多个节点”</text>
</svg>
