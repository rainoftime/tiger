<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compiler Design Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{
   --ok:#4caf50; --bad:#f44336; --border:#bbb;
   --bg:#fafafa; --fg:#222; --accent:#1565c0;
 }
 body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--fg);}
 header{padding:1rem;background:var(--accent);color:#fff;text-align:center;}
 main{padding:1rem;max-width:820px;margin:auto;}
 h2{margin-top:2rem;color:var(--accent); border-bottom: 2px solid #eee; padding-bottom: 0.5rem;}
 .q{padding:1rem;border:1px solid var(--border);border-radius:6px;margin-bottom:.8rem;background:#fff; transition: background 0.3s;}
 .q.correct{border-color:var(--ok);background:#f1f8f4;}
 .q.wrong  {border-color:var(--bad);background:#fef5f5;}
 label.option-label{display:block;padding:.4rem 0;cursor:pointer; transition: color 0.2s;}
 button{padding:.6rem 1rem;margin:1.5rem 0;font-size:1rem;border:none;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer; transition: background 0.3s;}
 .check-btn { padding: 0.4rem 0.8rem; margin: 0.5rem 0 0 0; font-size: 0.9rem; }
 button:hover:not(:disabled){background:#0d47a1;}
 button:disabled{opacity:.6;cursor:not-allowed;}
 #result{font-weight:bold;font-size:1.1rem;margin-top:1rem;padding:1rem;border-radius:4px; display:none;}
 #result.show{display:block; background:#e3f2fd;border:1px solid var(--accent);}
 footer{padding:1rem;text-align:center;font-size:.85rem;color:#555;}
 
 /* 代码块与解析的样式 */
 code { background: #eee; padding: 2px 5px; border-radius: 4px; color: #d63384; font-family: monospace; }
 .explanation {
   display: none;
   margin-top: 0.2rem;
   margin-bottom: 0.8rem;
   padding: 0.6rem;
   background-color: #f9f9f9;
   border-left: 3px solid var(--accent);
   font-size: 0.9rem;
   color: #444;
   white-space: pre-wrap; /* 保留文本中的换行符 */
 }
 .explanation.show {
   display: block;
   animation: fadeIn 0.4s ease;
 }
 @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
 @media(max-width:500px){body{font-size:15px;}}
</style>

<!-- 引入 MathJax 以支持类似于 $\sigma_1$ 的 LaTeX 公式渲染 -->
<script>
  MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<header><h1>Canonicalization – Self-Check Quiz</h1></header>
<main>
  <section id="tf"><h2>True / False</h2></section>
  <section id="mcq"><h2>Multiple Choice</h2></section>
  <div id="result"></div>
</main>
<footer>
  <p>Based on "Canonicalization" chapters. © 2026</p>
  <p style="margin-top: 1rem; font-size: 0.85rem;">
    📖 源码与贡献题目请访问：<a href="https://github.com/rainoftime/tiger/tree/main/exercises" target="_blank" style="color: var(--accent); text-decoration: none;">GitHub Exercises</a>
  </p>
</footer>

<script>
const tfWrap = document.getElementById('tf');
const mcqWrap = document.getElementById('mcq');
const resultBox = document.getElementById('result');

// 格式化文本：将反引号包裹的文本转换为 HTML 的 <code> 标签
function formatText(text) {
  if(!text) return "";
  return text.replace(/`([^`]+)`/g, '<code>$1</code>');
}

// build multiple choice / TF element
function buildMCQ(q, globalIdx, labelPrefix = "Q"){
  const div = document.createElement('div');
  div.className = 'q';
  div.dataset.correct = q.answer; // store index
  let optionsHTML = '';
  
  q.options.forEach((opt, idx) => {
    // 只有当有解析时才渲染解析 div
    const expHTML = opt.explanation ? `<div class=explanation>${formatText(opt.explanation)}</div>` : '';
    optionsHTML += `
      <label class="option-label" id="lbl-${globalIdx}-${idx}">
        <input type="radio" name="q${globalIdx}" value="${idx}">
        <span class="opt-text">${formatText(opt.text)}</span>
      </label>
      ${expHTML}
    `;
  });
  
  div.innerHTML=`<strong>${labelPrefix}.</strong> ${formatText(q.question)}<br><div style="margin-top:0.8rem;">${optionsHTML}</div>
                 <button class="check-btn" id="btn-${globalIdx}">Check Answer / 查看解析</button>`;
  return div;
}

// 每道题单独的判定逻辑
function gradeQuestion(div, qIndex, btn) {
  const correctIdx = parseInt(div.dataset.correct);
  const sel = div.querySelector('input[type=radio]:checked');
  
  // 如果没有选择，设定 selectedIdx 为 -1
  const selectedIdx = sel ? parseInt(sel.value) : -1;
  
  // 判断对错（未作答视为错误）
  if(selectedIdx === correctIdx){
    div.classList.add('correct');
  }else{
    div.classList.add('wrong');
  }
  
  // 显示解析
  div.querySelectorAll('.explanation').forEach(exp => exp.classList.add('show'));
  
  // 高亮选项颜色（正确答案标绿加粗，选错的标红）
  div.querySelectorAll('.option-label').forEach((lbl, idx) => {
    const radio = lbl.querySelector('input');
    radio.disabled = true; // 提交后禁用选项
    
    // 增加 padding 以适应背景色高亮
    lbl.style.padding = '0.4rem 0.5rem';
    lbl.style.borderRadius = '4px';
    
    if (idx === correctIdx) {
      lbl.style.color = '#2e7d32';
      lbl.style.fontWeight = 'bold';
      lbl.style.backgroundColor = '#e8f5e9'; // 浅绿色背景
      lbl.querySelector('.opt-text').innerHTML += ' ✅';
    } else if (idx === selectedIdx && selectedIdx !== correctIdx) {
      lbl.style.color = '#c62828';
      lbl.style.fontWeight = 'bold';
      lbl.style.backgroundColor = '#ffebee'; // 浅红色背景
      lbl.querySelector('.opt-text').innerHTML += ' ❌';
    }
  });
  
  btn.disabled = true;
  btn.textContent = 'Answered (已显示解析)';
  
  checkAllFinished();
}

// 检查是否所有题目均已作答，完成后显示总分
function checkAllFinished() {
  const total = quizData.trueFalse.length + quizData.multipleChoice.length;
  const answered = document.querySelectorAll('.q.correct, .q.wrong').length;
  if (answered === total) {
    const correct = document.querySelectorAll('.q.correct').length;
    resultBox.innerHTML = `All Answered! Final Score (您的总成绩): ${correct} / ${total} (${Math.round(correct/total*100)}%)`;
    resultBox.classList.add('show');
  }
}

// 数据结构化 (新增了 True/False 和 指令选择 的多选题)
const quizData = {

        question: "A canonical tree may contain ESEQ nodes if they are located at the very bottom of the tree.",

        },
        {
            text: "False",

        }
        ],
        answer: 1
    },
    {
        question: "The parent of every CALL node in a canonical tree must be either an EXP or a MOVE node.",
        options: [

        {

        }
        ],
        answer: 0
    },
    {
        question: "Real machine conditional jump instructions typically fall through to the next instruction if the condition is true.",
        options: [
        {
            text: "True",

        },
        {
            text: "False",

        }
        ],

        question: "MEM(ESEQ(s,e1))=ESEQ(s,MEM(e1)) is used to lift side effects out of memory access nodes.",
        options: [

        },
        {

            explanation: "This is a valid identity provided in Figure 8.1 for canonicalizing trees."
        }
        ],
        answer: 0
    },
    {
        question: "The linearize function works by repeatedly applying the rule SEQ(SEQ(a,b),c)=SEQ(a,SEQ(b,c)).",
        options: [
        {

        ],

    },
    {

        options: [
        {
            text: "True",

        },
        {
            text: "False",
            explanation: "A covering set requires that every block is included exactly once to reconstruct the full program."
        }
        ],
        answer: 0
    },
    {
        question: "If a statement s is EXP(CONST n), the commute(s,e) function will always return true for any expression e.",
        options: [
        {
            text: "True",
            explanation: "正确答案\nAn empty or constant statement has no side effects and thus commutes with any expression."
        },
        {
            text: "False",
            explanation: "Constants and 'no-ops' are the only cases where the commute function returns true with certainty."
        }
        ],
        answer: 0
    }
  ],
  multipleChoice: [
    {
        question: "Which of the following is NOT a property of a canonical tree as defined in the source material?",
        options: [
        {
            text: "A. The parent of every CALL node is either EXP(…) or MOVE(TEMP t,…).",
            explanation: "This property ensures that function calls are pulled to the top level, preventing register conflicts."
        },
        {
            text: "B. It contains no SEQ or ESEQ nodes.",
            explanation: "One of the two primary defining characteristics of canonical trees is the complete absence of SEQ and ESEQ nodes."
        },
        {
            text: "C. All CJUMP instructions are immediately followed by their true labels.",
            explanation: "正确答案\nCanonical trees themselves do not guarantee CJUMP ordering; that is the specific task of the later trace scheduling phase."
        },
        {
            text: "D. All SEQ nodes are removed and replaced by a linear list of statements.",
            explanation: "The linearization process specifically eliminates SEQ nodes to create a simplified list of T_stms."
        }
        ],
        answer: 2
    },
    {
        question: "Why are ESEQ and CALL nodes within expressions considered problematic for the compiler?",
        options: [
        {
            text: "A. They are not supported by any intermediate representation language.",
            explanation: "These nodes are actually part of the Tree intermediate language; the problem is their mismatch with machine code."
        },
        {

            explanation: "The source does not mention floating-point registers as a constraint for ESEQ or CALL nodes."
        },
        {

        },
        {
            text: "D. They make it impossible to generate any assembly code.",
            explanation: "Code can still be generated, but it is much more difficult to optimize and align with machine capabilities."
        }
        ],
        answer: 2
    },
    {
        question: "When rewriting BINOP(op,e1,ESEQ(s,e2)) where the statement s and expression e1 do NOT commute, what transformation is required?",
        options: [

        {

        },

            explanation: "Reordering for frequency is a trace optimization, not the purpose of the reorder function."

        {

        },

            explanation: "The compiler allows multiple calls but must transform them to avoid register conflicts."
        },
        {

            explanation: "Arguments must be evaluated before the call to be passed to the function."
        },
        {

            explanation: "Most machines use a single dedicated return-value register, so the compiler must manage it with temporaries."
        }
        ],
        answer: 0
    },
    {
        question: "Which of the following is a strict requirement for a sequence of statements to be considered a 'basic block'?",
        options: [
        {
            text: "A. It must contain exactly ten statements.",
            explanation: "Basic blocks can be of any length as long as they follow the entry/exit rules."
        },
        {
            text: "B. It must end with a function CALL.",
            explanation: "A CALL does not necessarily end a basic block; only control flow changes like JUMP or CJUMP do."
        },
        {
            text: "C. It must contain at least one ESEQ node.",
            explanation: "Basic blocks are formed after ESEQ nodes have already been eliminated."
        },
        {
            text: "D. The first statement is a LABEL and the last is a JUMP or CJUMP.",
            explanation: "正确答案\nA basic block is defined as having a single entry point (the label) and a single exit point (the jump)."
        }
        ],
        answer: 3
    },
    {
        question: "What happens if a basic block does not naturally end with a JUMP or CJUMP according to the division algorithm?",
        options: [
        {
            text: "A. The compiler throws a syntax error.",
            explanation: "This is a normal part of the algorithm and is handled automatically, not an error."
        },
        {
            text: "B. A JUMP to the next block's label is appended to the end.",
            explanation: "正确答案\nTo ensure every block exits via a jump, the algorithm adds an explicit jump to the logically following block."
        },
        {
            text: "C. The block is deleted as unreachable code.",
            explanation: "Unreachability is not determined at this stage; the block is preserved by adding the necessary control flow."
        },
        {
            text: "D. The block is merged with the previous block.",
            explanation: "Blocks are defined by their boundaries; missing boundaries are added rather than merged."
        }
        ],
        answer: 1
    },
    {
        question: "The commute function is described as 'naive.' Which of the following is a conservative assumption it makes?",
        options: [
        {
            text: "A. A TEMP node always commutes with a MEM node.",
            explanation: "The source states that unless it's a constant or a name, the function assumes they do not commute."
        },
        {
            text: "B. Function calls are always assumed to commute with arithmetic operations.",
            explanation: "Function calls have side effects and are generally assumed NOT to commute."
        },
        {
            text: "C. Any statement that is not an 'empty' statement (isNop) is assumed NOT to commute with non-constant expressions.",
            explanation: "正确答案\nBecause the compiler cannot easily determine if memory locations or temporaries overlap, it conservatively assumes they don't commute to ensure correctness."
        },
        {
            text: "D. All statements commute with all expressions.",
            explanation: "This would be an optimistic and dangerous assumption that could break the program."
        }
        ],
        answer: 2
    }
    ]
};

// 动态构建界面
let globalCounter = 0;

// 1. 渲染判断题
quizData.trueFalse.forEach((q, i) => {
  const qDiv = buildMCQ(q, globalCounter, `T/F ${i+1}`);
  tfWrap.appendChild(qDiv);
  
  const btn = qDiv.querySelector(`#btn-${globalCounter}`);
  const currentCounter = globalCounter;
  btn.addEventListener('click', () => gradeQuestion(qDiv, currentCounter, btn));
  globalCounter++;
});

// 2. 渲染单选题
quizData.multipleChoice.forEach((q, i) => {
  const qDiv = buildMCQ(q, globalCounter, `Q${i+1}`);
  mcqWrap.appendChild(qDiv);
  
  const btn = qDiv.querySelector(`#btn-${globalCounter}`);
  const currentCounter = globalCounter;
  btn.addEventListener('click', () => gradeQuestion(qDiv, currentCounter, btn));
  globalCounter++;
});
</script>
</body>
</html>
