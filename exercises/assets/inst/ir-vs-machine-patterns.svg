<svg width="1400" height="920" viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fbfd"/>
      <stop offset="100%" stop-color="#f3f8ee"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; }
      .subtitle { font: 500 20px "PingFang SC", "Noto Sans SC", sans-serif; fill: #4c657b; }
      .panel-title { font: 700 28px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; }
      .body { font: 500 19px "PingFang SC", "Noto Sans SC", sans-serif; fill: #35506a; }
      .mono { font: 700 20px "SFMono-Regular", Consolas, monospace; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
      .mono-left { font: 700 20px "SFMono-Regular", Consolas, monospace; fill: #17324d; }
      .badge { font: 700 17px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
      .node { fill: #ffffff; stroke: #294963; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg3)"/>
  <text x="86" y="84" class="title">Why Tree Patterns Work, and Where They Break</text>
  <text x="86" y="122" class="subtitle">IR 节点很细粒度，但真实机器指令可能覆盖多个 primitive；多结果副作用则更难表达</text>

  <rect x="70" y="165" width="600" height="690" rx="28" fill="#ffffff" filter="url(#shadow3)"/>
  <rect x="730" y="165" width="600" height="690" rx="28" fill="#ffffff" filter="url(#shadow3)"/>

  <text x="110" y="220" class="panel-title">One instruction can cover many IR primitives</text>
  <text x="770" y="220" class="panel-title">Side-effecting instruction: not a clean tree</text>

  <rect x="110" y="250" width="200" height="44" rx="14" fill="#9fd4ff"/>
  <text x="210" y="278" class="badge">合法 tree pattern</text>
  <rect x="770" y="250" width="220" height="44" rx="14" fill="#f9b7cb"/>
  <text x="880" y="278" class="badge">一个指令产生两个效果</text>

  <line x1="300" y1="360" x2="300" y2="420" stroke="#294963" stroke-width="4"/>
  <line x1="300" y1="420" x2="210" y2="490" stroke="#294963" stroke-width="4"/>
  <line x1="300" y1="420" x2="390" y2="490" stroke="#294963" stroke-width="4"/>
  <line x1="210" y1="520" x2="150" y2="585" stroke="#294963" stroke-width="4"/>
  <line x1="210" y1="520" x2="270" y2="585" stroke="#294963" stroke-width="4"/>

  <rect x="240" y="315" width="120" height="56" rx="18" fill="#eef7ff" stroke="#4b9ce2" stroke-width="3"/>
  <text x="300" y="343" class="mono">MEM</text>

  <rect x="150" y="490" width="120" height="56" rx="18" fill="#eef7ff" stroke="#4b9ce2" stroke-width="3"/>
  <text x="210" y="518" class="mono">PLUS</text>

  <rect x="330" y="490" width="120" height="56" rx="18" class="node"/>
  <text x="390" y="518" class="mono">CONST 8</text>

  <rect x="90" y="585" width="120" height="56" rx="18" class="node"/>
  <text x="150" y="613" class="mono">TEMP fp</text>

  <rect x="210" y="585" width="120" height="56" rx="18" class="node"/>
  <text x="270" y="613" class="mono">TEMP idx</text>

  <path d="M475 515 C530 515, 575 515, 620 515" fill="none" stroke="#33a06f" stroke-width="8" stroke-linecap="round"/>
  <polygon points="620,515 596,501 596,529" fill="#33a06f"/>
  <rect x="455" y="430" width="165" height="170" rx="24" fill="#edf9f1" stroke="#33a06f" stroke-width="3"/>
  <text x="485" y="485" class="mono-left">LOAD r1,</text>
  <text x="485" y="523" class="mono-left">[fp + idx + 8]</text>
  <text x="485" y="572" class="body">一个 tile</text>

  <text x="110" y="700" class="body">核心思想: IR 把动作拆细，指令选择再把多个节点“合起来”</text>
  <text x="110" y="735" class="body">例如加载指令可同时表达地址计算 + 访存</text>

  <rect x="785" y="340" width="200" height="96" rx="22" fill="#fff4f1" stroke="#e2815c" stroke-width="3"/>
  <text x="885" y="385" class="mono">LOAD++</text>
  <text x="885" y="416" class="body" text-anchor="middle">r2 ← M[r1]</text>

  <path d="M885 436 L885 510" stroke="#e2815c" stroke-width="5"/>
  <path d="M885 510 L820 580" stroke="#e2815c" stroke-width="5"/>
  <path d="M885 510 L950 580" stroke="#e2815c" stroke-width="5"/>

  <rect x="760" y="580" width="160" height="90" rx="22" fill="#fff0f5" stroke="#d36a95" stroke-width="3"/>
  <text x="840" y="620" class="mono">result</text>
  <text x="840" y="648" class="body" text-anchor="middle">use loaded value</text>

  <rect x="950" y="580" width="160" height="90" rx="22" fill="#fff0f5" stroke="#d36a95" stroke-width="3"/>
  <text x="1030" y="620" class="mono">effect</text>
  <text x="1030" y="648" class="body" text-anchor="middle">r1 ← r1 + 4</text>

  <text x="770" y="720" class="body">问题: tree pattern 的根通常只表示一个结果/效果</text>
  <text x="770" y="755" class="body">但 autoincrement 这类指令同时更新“值”和“地址寄存器”</text>
  <text x="770" y="790" class="body">所以常见做法是:</text>
  <text x="885" y="790" class="body">忽略它、特判 idiom、或改用 DAG-based matching</text>
</svg>
