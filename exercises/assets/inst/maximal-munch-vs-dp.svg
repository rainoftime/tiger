<svg width="1400" height="920" viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef7f2"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; }
      .subtitle { font: 500 20px "PingFang SC", "Noto Sans SC", sans-serif; fill: #4c657b; }
      .panel { fill: #ffffff; }
      .panel-title { font: 700 28px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; }
      .body { font: 500 18px "PingFang SC", "Noto Sans SC", sans-serif; fill: #34506a; }
      .mono { font: 700 20px "SFMono-Regular", Consolas, monospace; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
      .small-mono { font: 700 18px "SFMono-Regular", Consolas, monospace; fill: #17324d; }
      .cost { font: 700 18px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
      .tag { font: 700 17px "PingFang SC", "Noto Sans SC", sans-serif; fill: #17324d; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg2)"/>
  <text x="88" y="82" class="title">Maximal Munch vs Dynamic Programming</text>
  <text x="88" y="120" class="subtitle">局部贪心选择最大的 tile，还是自底向上计算全局最优代价</text>

  <rect x="70" y="165" width="605" height="680" rx="28" class="panel" filter="url(#shadow2)"/>
  <rect x="725" y="165" width="605" height="680" rx="28" class="panel" filter="url(#shadow2)"/>

  <text x="110" y="220" class="panel-title">Maximal Munch</text>
  <text x="765" y="220" class="panel-title">Dynamic Programming</text>

  <rect x="110" y="250" width="180" height="44" rx="14" fill="#ffe08a"/>
  <text x="200" y="278" class="tag">Top-down / greedy</text>
  <rect x="765" y="250" width="210" height="44" rx="14" fill="#9fe2c0"/>
  <text x="870" y="278" class="tag">Bottom-up / optimum cost</text>

  <line x1="370" y1="335" x2="370" y2="390" stroke="#294963" stroke-width="4"/>
  <line x1="370" y1="390" x2="270" y2="455" stroke="#294963" stroke-width="4"/>
  <line x1="370" y1="390" x2="470" y2="455" stroke="#294963" stroke-width="4"/>
  <line x1="270" y1="485" x2="215" y2="548" stroke="#294963" stroke-width="4"/>
  <line x1="270" y1="485" x2="325" y2="548" stroke="#294963" stroke-width="4"/>
  <line x1="470" y1="485" x2="415" y2="548" stroke="#294963" stroke-width="4"/>
  <line x1="470" y1="485" x2="525" y2="548" stroke="#294963" stroke-width="4"/>

  <rect x="315" y="300" width="110" height="56" rx="18" fill="#fff8dc" stroke="#d99a00" stroke-width="3"/>
  <text x="370" y="328" class="mono">MEM</text>

  <rect x="215" y="455" width="110" height="56" rx="18" fill="#eef7ff" stroke="#4b9ce2" stroke-width="3"/>
  <text x="270" y="483" class="mono">PLUS</text>

  <rect x="415" y="455" width="110" height="56" rx="18" fill="#fff4f1" stroke="#e2815c" stroke-width="3"/>
  <text x="470" y="483" class="mono">CONST</text>

  <rect x="160" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="215" y="576" class="mono">CONST 1</text>

  <rect x="270" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="325" y="576" class="mono">CONST 2</text>

  <rect x="360" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="415" y="576" class="mono">TEMP p</text>

  <rect x="470" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="525" y="576" class="mono">TEMP q</text>

  <path d="M206 646 C240 612, 305 610, 340 646" fill="none" stroke="#d99a00" stroke-width="8" stroke-linecap="round"/>
  <path d="M335 626 L405 626" fill="none" stroke="#d99a00" stroke-width="8" stroke-linecap="round"/>
  <rect x="150" y="665" width="320" height="100" rx="22" fill="#fff8dc" stroke="#d99a00" stroke-width="3"/>
  <text x="182" y="710" class="small-mono">1. pick largest tile at root</text>
  <text x="182" y="744" class="small-mono">2. recurse on uncovered leaves</text>

  <text x="110" y="800" class="body">优点: 实现简单、速度快、RISC 上通常足够好</text>
  <text x="110" y="830" class="body">局限: 只保证 optimal，不一定是 optimum</text>

  <line x1="1025" y1="335" x2="1025" y2="390" stroke="#294963" stroke-width="4"/>
  <line x1="1025" y1="390" x2="925" y2="455" stroke="#294963" stroke-width="4"/>
  <line x1="1025" y1="390" x2="1125" y2="455" stroke="#294963" stroke-width="4"/>
  <line x1="925" y1="485" x2="870" y2="548" stroke="#294963" stroke-width="4"/>
  <line x1="925" y1="485" x2="980" y2="548" stroke="#294963" stroke-width="4"/>
  <line x1="1125" y1="485" x2="1070" y2="548" stroke="#294963" stroke-width="4"/>
  <line x1="1125" y1="485" x2="1180" y2="548" stroke="#294963" stroke-width="4"/>

  <rect x="970" y="300" width="110" height="56" rx="18" fill="#edf9f1" stroke="#33a06f" stroke-width="3"/>
  <text x="1025" y="328" class="mono">MEM</text>
  <circle cx="1090" cy="300" r="22" fill="#33a06f"/>
  <text x="1090" y="300" class="cost">2</text>

  <rect x="870" y="455" width="110" height="56" rx="18" fill="#edf9f1" stroke="#33a06f" stroke-width="3"/>
  <text x="925" y="483" class="mono">PLUS</text>
  <circle cx="990" cy="455" r="22" fill="#33a06f"/>
  <text x="990" y="455" class="cost">1</text>

  <rect x="1070" y="455" width="110" height="56" rx="18" fill="#edf9f1" stroke="#33a06f" stroke-width="3"/>
  <text x="1125" y="483" class="mono">CONST</text>
  <circle cx="1190" cy="455" r="22" fill="#33a06f"/>
  <text x="1190" y="455" class="cost">1</text>

  <rect x="815" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="870" y="576" class="mono">CONST 1</text>
  <circle cx="935" cy="548" r="22" fill="#4b9ce2"/>
  <text x="935" y="548" class="cost">1</text>

  <rect x="925" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="980" y="576" class="mono">CONST 2</text>
  <circle cx="1045" cy="548" r="22" fill="#4b9ce2"/>
  <text x="1045" y="548" class="cost">1</text>

  <rect x="1015" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="1070" y="576" class="mono">TEMP p</text>

  <rect x="1125" y="548" width="110" height="56" rx="18" fill="#f4f7fb" stroke="#294963" stroke-width="3"/>
  <text x="1180" y="576" class="mono">TEMP q</text>

  <rect x="820" y="665" width="450" height="100" rx="22" fill="#edf9f1" stroke="#33a06f" stroke-width="3"/>
  <text x="855" y="707" class="small-mono">cost(node) = tile_cost + sum(cost(leaf subtrees))</text>
  <text x="855" y="741" class="small-mono">choose the minimum among all matching tiles</text>

  <text x="765" y="800" class="body">优点: 能找到全局最低代价的 tiling</text>
  <text x="765" y="830" class="body">代价: 规则更多时实现更复杂，但仍是线性时间</text>
</svg>
