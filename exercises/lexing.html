<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compiler Design Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{
   --ok:#4caf50; --bad:#f44336; --border:#bbb;
   --bg:#fafafa; --fg:#222; --accent:#1565c0;
 }
 body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--fg);}
 header{padding:1rem;background:var(--accent);color:#fff;text-align:center;}
 main{padding:1rem;max-width:820px;margin:auto;}
 h2{margin-top:2rem;color:var(--accent); border-bottom: 2px solid #eee; padding-bottom: 0.5rem;}
 .q{padding:1rem;border:1px solid var(--border);border-radius:6px;margin-bottom:.8rem;background:#fff; transition: background 0.3s;}
 .q.correct{border-color:var(--ok);background:#f1f8f4;}
 .q.wrong  {border-color:var(--bad);background:#fef5f5;}
 label.option-label{display:block;padding:.4rem 0;cursor:pointer; transition: color 0.2s;}
 button{padding:.6rem 1rem;margin:1.5rem 0;font-size:1rem;border:none;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer; transition: background 0.3s;}
 .check-btn { padding: 0.4rem 0.8rem; margin: 0.5rem 0 0 0; font-size: 0.9rem; }
 button:hover:not(:disabled){background:#0d47a1;}
 button:disabled{opacity:.6;cursor:not-allowed;}
 #result{font-weight:bold;font-size:1.1rem;margin-top:1rem;padding:1rem;border-radius:4px; display:none;}
 #result.show{display:block; background:#e3f2fd;border:1px solid var(--accent);}
 footer{padding:1rem;text-align:center;font-size:.85rem;color:#555;}
 
 /* 代码块与解析的样式 */
 code { background: #eee; padding: 2px 5px; border-radius: 4px; color: #d63384; font-family: monospace; }
 .explanation {
   display: none;
   margin-top: 0.2rem;
   margin-bottom: 0.8rem;
   padding: 0.6rem;
   background-color: #f9f9f9;
   border-left: 3px solid var(--accent);
   font-size: 0.9rem;
   color: #444;
   white-space: pre-wrap; /* 保留文本中的换行符 */
 }
 .explanation.show {
   display: block;
   animation: fadeIn 0.4s ease;
 }
 @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
 @media(max-width:500px){body{font-size:15px;}}
</style>

<!-- 引入 MathJax 以支持类似于 $\sigma_1$ 的 LaTeX 公式渲染 -->
<script>
  MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<header><h1>Lexical Analysis – Self-Check Quiz</h1></header>
<main>
  <section id="tf"><h2>True / False</h2></section>
  <section id="mcq"><h2>Multiple Choice</h2></section>
  <div id="result"></div>
</main>
<footer>
  <p>Based on "Lexical Analysis" chapters. © 2026</p>
  <p style="margin-top: 1rem; font-size: 0.85rem;">
    📖 源码与贡献题目请访问：<a href="https://github.com/rainoftime/tiger/tree/main/exercises" target="_blank" style="color: var(--accent); text-decoration: none;">GitHub Exercises</a>
  </p>
</footer>

<script>
const tfWrap = document.getElementById('tf');
const mcqWrap = document.getElementById('mcq');
const resultBox = document.getElementById('result');

// 格式化文本：将反引号包裹的文本转换为 HTML 的 <code> 标签
function formatText(text) {
  if(!text) return "";
  return text.replace(/`([^`]+)`/g, '<code>$1</code>');
}

// build multiple choice / TF element
function buildMCQ(q, globalIdx, labelPrefix = "Q"){
  const div = document.createElement('div');
  div.className = 'q';
  div.dataset.correct = q.answer; // store index
  let optionsHTML = '';
  
  q.options.forEach((opt, idx) => {
    // 只有当有解析时才渲染解析 div
    const expHTML = opt.explanation ? `<div class="explanation">${formatText(opt.explanation)}</div>` : '';
    optionsHTML += `
      <label class="option-label" id="lbl-${globalIdx}-${idx}">
        <input type="radio" name="q${globalIdx}" value="${idx}">
        <span class="opt-text">${formatText(opt.text)}</span>
      </label>
      ${expHTML}
    `;
  });
  
  div.innerHTML=`<strong>${labelPrefix}.</strong> ${formatText(q.question)}<br><div style="margin-top:0.8rem;">${optionsHTML}</div>
                 <button class="check-btn" id="btn-${globalIdx}">Check Answer / 查看解析</button>`;
  return div;
}

// 每道题单独的判定逻辑
function gradeQuestion(div, qIndex, btn) {
  const correctIdx = parseInt(div.dataset.correct);
  const sel = div.querySelector('input[type=radio]:checked');
  
  // 如果没有选择，设定 selectedIdx 为 -1
  const selectedIdx = sel ? parseInt(sel.value) : -1;
  
  // 判断对错（未作答视为错误）
  if(selectedIdx === correctIdx){
    div.classList.add('correct');
  }else{
    div.classList.add('wrong');
  }
  
  // 显示解析
  div.querySelectorAll('.explanation').forEach(exp => exp.classList.add('show'));
  
  // 高亮选项颜色（正确答案标绿加粗，选错的标红）
  div.querySelectorAll('.option-label').forEach((lbl, idx) => {
    const radio = lbl.querySelector('input');
    radio.disabled = true; // 提交后禁用选项
    
    // 增加 padding 以适应背景色高亮
    lbl.style.padding = '0.4rem 0.5rem';
    lbl.style.borderRadius = '4px';
    
    if (idx === correctIdx) {
      lbl.style.color = '#2e7d32';
      lbl.style.fontWeight = 'bold';
      lbl.style.backgroundColor = '#e8f5e9'; // 浅绿色背景
      lbl.querySelector('.opt-text').innerHTML += ' ✅';
    } else if (idx === selectedIdx && selectedIdx !== correctIdx) {
      lbl.style.color = '#c62828';
      lbl.style.fontWeight = 'bold';
      lbl.style.backgroundColor = '#ffebee'; // 浅红色背景
      lbl.querySelector('.opt-text').innerHTML += ' ❌';
    }
  });
  
  btn.disabled = true;
  btn.textContent = 'Answered (已显示解析)';
  
  checkAllFinished();
}

// 检查是否所有题目均已作答，完成后显示总分
function checkAllFinished() {
  const total = quizData.trueFalse.length + quizData.multipleChoice.length;
  const answered = document.querySelectorAll('.q.correct, .q.wrong').length;
  if (answered === total) {
    const correct = document.querySelectorAll('.q.correct').length;
    resultBox.innerHTML = `All Answered! Final Score (您的总成绩): ${correct} / ${total} (${Math.round(correct/total*100)}%)`;
    resultBox.classList.add('show');
  }
}

// 数据结构化 (新增了 True/False 和 指令选择 的多选题)
const quizData = {
  trueFalse: [
    {
        question: "In most programming languages, reserved words like 'if' or 'return' can also be used as identifiers.",
        options: [
        {
            text: "True",

        },
        {
            text: "False",
            explanation: "正确答案\nReserved words are typically excluded from the set of valid identifiers to prevent syntactic ambiguity."
        }
        ],
        answer: 1
        },
    {
        question: "The regular expression concatenation operator $(M⋅N)$ defines a language where a string is in the language of $M$ followed by a string in the language of $N$.",
        options: [
        {
            text: "True",
            explanation: "正确答案\nConcatenation combines strings in sequence, where the first part must match $M$ and the second part must match $N$."
        },
        {
            text: "False",
            explanation: "Concatenation specifically implies sequence, unlike alternation which implies choice"
        }
        ],
        answer: 0
    },
    {
        question: "A deterministic finite automaton (DFA) can be in multiple states simultaneously for a single input string.",
        options: [
        {
            text: "True",
            explanation: "Being in multiple states simultaneously is a characteristic used to describe or simulate an NFA, not a DFA."
        },
        {
            text: "False",

        }
        ],
        answer: 1
    },
    {
        question: "The 'rule priority' rule states that if the longest match can be described by two different regular expressions, the one that appears earlier in the specification is chosen.",
        options: [
        {
            text: "True",
            explanation: "正确答案\nPriority is the tie-breaker used when multiple rules match the same longest substring of the input."
        },
        {
            text: "False",
            explanation: "Priority is indeed the mechanism for resolving identical-length match conflicts in tools like Lex."
        }
        ],
        answer: 0
    },
    {
        question: "An NFA can follow an ϵ (epsilon) edge only if the current character in the input stream is a space or tab.",

        },

        ],

        },
        {
            text: "False",

        }
        ],
        answer: 1
    },
    {
        question: "Lexical analysis is responsible for calculating the program's meaning.",
        options: [
        {
            text: "True",
            explanation: "This confuses lexical analysis with semantic analysis, the latter of which deals with program meaning."
        },
        {
            text: "False",
            explanation: "正确答案\nCalculating the meaning is the job of semantic analysis; lexical analysis only identifies the tokens."
        }
        ],
        answer: 1
    },
    {
        question: "Two states in an automaton are equivalent if they are both final and have identical transitions for every possible input symbol.",
        options: [
        {
            text: "True",
            explanation: "正确答案\nThis is a basic sufficient condition for equivalence: same acceptance status and same destination for every symbol."
        },
        {
            text: "False",
            explanation: "If their acceptance status and transitions are identical, there is no way to distinguish them from the outside."
        }
        ],
        answer: 0
    },
    {
        question: "The regular expression `(a | b)*` matches any string composed entirely of 'a's and 'b's, including the empty string.",
        options: [
        {
            text: "True",
            explanation: "正确答案\nThe Kleene closure (∗) allows for zero repetitions, which results in the empty string (ϵ)."
        },
        {
            text: "False",
            explanation: "Because the asterisk allows for zero instances of the choice between 'a' and 'b', the empty string is included."
        }
        ],
        answer: 0
    },
    {
        question: "Lexical analysis is the only phase of the compiler that uses mathematical formalisms like finite automata.",
        options: [
        {
            text: "True",
            explanation: "Formal languages and automata theory are heavily utilized in syntax analysis (parsing) as well."
        },
        {
            text: "False",
            explanation: "正确答案\nThe text mentions that similar formalisms and tools are useful in the study of parsing and other areas of compilation."
        }
        ],
        answer: 1
    }
  ],
  multipleChoice: [
    {
        question: "Why is lexical analysis typically separated from the parsing (syntax analysis) stage?",
        options: [
        {
            text: "A. Because regular expressions cannot be converted into finite automata",
            explanation: "Regular expressions are specifically used because they can be efficiently converted into deterministic finite automata."
        },
        {
            text: "B. Because lexical analysis is more computationally complex than parsing",
            explanation: "The material notes that lexical analysis is actually not very complicated compared to higher-level analysis."
        },
        {
            text: "C. To allow the compiler to skip semantic analysis entirely",
            explanation: "Semantic analysis is a necessary subsequent step to understand program meaning regardless of how the lexer is structured."
        },
        {
            text: "D. To avoid complicating the parser with whitespace and comment handling",
            explanation: "正确答案\nSeparating these tasks keeps the parser focused on grammar rules without checking for blanks at every point."
        }
        ],
        answer: 3
    },
    {
        question: "What is the result of applying the 'Longest Match' rule to the input string 'if8' in a typical programming language lexer?",
        options: [
        {
            text: "A. It is split into 'if', '8', and an 'EOF' token",
            explanation: "Tokens are not split if a single rule (like the identifier rule) can consume more characters."
        },
        {
            text: "B. It is recognized as a reserved word 'if' followed by the number '8'",
            explanation: "While 'if' matches, it is not the longest possible match available for that initial substring."
        },
        {

        },
        {
            text: "D. It results in a lexical error because reserved words cannot contain digits",
            explanation: "Reserved words are specific strings; if a string starts with a reserved word but continues, it is evaluated as a longer token like an identifier."
        }
        ],
        answer: 2
    },
    {
        question: "In a Lex specification, which variable contains the actual string of characters matched by the regular expression?",
        options: [
        {
            text: "A. yylval",
            explanation: "This is a union used to pass semantic values, like the integer value of a number token, to the parser."
        },
        {
            text: "B. yyparse",
            explanation: "This is usually the name of the function for the parser, not a variable containing token text."
        },
        {
            text: "C. yytext",
            explanation: "正确答案\nThis global variable points to the buffer containing the character sequence for the current token."
        },

        options: [

            text: "B. To mark the beginning of a comment block",
            explanation: "Comments are typically handled by transitions to specific states or start states, not a universal 'dead' state."

        {

        },
        {
            text: "D. To encode the absence of a valid edge for a given input",
            explanation: "正确答案\nA dead state (often state 0) represents a path that can never lead to an accepting state."
        }
        ],
        answer: 3
    },
    {
        question: "The regular expression [0−9]+ matches which of the following?",
        options: [
        {
            text: "A. Only the digits 0 and 9",
            explanation: "The hyphen in [0−9] signifies a range covering all digits from 0 through 9."
        },
        {
            text: "B. Exactly one digit between 0 and 9",
            explanation: "The square brackets match one digit, but the plus operator allows for multiple digits."
        },
        {
            text: "C. A sequence of one or more digits",
            explanation: "正确答案\nThe plus operator (+) indicates one or more repetitions of the preceding character set."
        },
        {
            text: "D. A sequence of zero or more digits",
            explanation: "Zero or more repetitions is denoted by the asterisk ( ∗ ) operator."
        }
        ],
        answer: 2
    },
    {
        question: "Which mathematical operation is used to find all NFA states reachable from a set of states without consuming any input characters?",
        options: [
        {
            text: "A. Concatenation",
            explanation: "Concatenation joins expressions together and requires input to progress from the first expression to the second."
        },
        {
            text: "B. ϵ-closure",
            explanation: "正确答案\nThe closure operation iteratively follows all epsilon edges to determine the full set of possible current states."
        },
        {
            text: "C. DFA minimization",
            explanation: "Minimization is used to reduce the number of states in a DFA, not to explore NFA reachability."
        },
        {
            text: "D. Alternation",
            explanation: "Alternation represents a choice between two different regular expressions (M∣N)."
        }
        ],
        answer: 1
    },
    {
        question: "When converting an NFA with n states to a DFA, what is the theoretical maximum number of states the resulting DFA could have?",
        options: [
        {
            text: "A. $n^2$",
            explanation: "While a common polynomial growth factor, the subset construction for automata is exponential."
        },
        {
            text: "B. $2^n$",
            explanation: "正确答案\nBecause each DFA state corresponds to a subset of NFA states, the power set of n states is $2^n$."
        },
        {
            text: "C. $2n$",
            explanation: "In practice, the number of states is often close to n, but the worst-case scenario is much larger."
        },
        {
            text: "D. $n!$",
            explanation: "Factorial growth is associated with permutations, but DFA states are formed from combinations (subsets)."
        }
        ],
        answer: 1
    },
    {
        question: "In Lex, what mechanism is used to handle different contexts, such as being inside or outside of a comment block?",
        options: [
        {
            text: "A. Rule priority",
            explanation: "Priority resolves ties between rules in the same context, but doesn't manage multiple contexts."
        },
        {
            text: "B. Sentinel characters",
            explanation: "Sentinels are an optimization for buffer management, not a logical context-switching tool."
        },
        {
            text: "C. Kleene closure",
            explanation: "Kleene closure handles repetition within a single expression, not transitions between lexing modes."
        },
        {
            text: "D. Start states",
            explanation: "正确答案\nStart states allow the lexer to activate different sets of regular expressions depending on the current context."

        },

        },
        {

        }

    },

        options: [
        {
            text: "A. If the machine accepts a string σ starting from $s_1$ if and only if it accepts σ starting from $s_2$",
            explanation: "正确答案\nEquivalent states produce the same future behavior for all possible subsequent input strings."
        },
        {
            text: "B. If they both have edges leading back to the start state",
            explanation: "Transitions to the start state do not imply that the states themselves behave identically for all inputs."
        },
        {
            text: "C. If they have the same state number in the transition matrix",
            explanation: "State numbers are arbitrary labels and do not reflect the logical behavior of the state transitions."
        },
        {
            text: "D. If they are both non-final states with no outgoing edges",
            explanation: "While these are likely equivalent, it is only a specific case of the broader rule involving all possible strings."

};

// 动态构建界面
let globalCounter = 0;

// 1. 渲染判断题
quizData.trueFalse.forEach((q, i) => {
  const qDiv = buildMCQ(q, globalCounter, `T/F ${i+1}`);
  tfWrap.appendChild(qDiv);
  
  const btn = qDiv.querySelector(`#btn-${globalCounter}`);
  const currentCounter = globalCounter;
  btn.addEventListener('click', () => gradeQuestion(qDiv, currentCounter, btn));
  globalCounter++;
});

// 2. 渲染单选题
quizData.multipleChoice.forEach((q, i) => {
  const qDiv = buildMCQ(q, globalCounter, `Q${i+1}`);
  mcqWrap.appendChild(qDiv);
  
  const btn = qDiv.querySelector(`#btn-${globalCounter}`);
  const currentCounter = globalCounter;
  btn.addEventListener('click', () => gradeQuestion(qDiv, currentCounter, btn));
  globalCounter++;
});
</script>
</body>
</html>
